name: Build Thanos Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "Thanos-Android-App-Project.zip" ]; then
            mkdir -p extracted
            unzip -q Thanos-Android-App-Project.zip -d extracted
            PROJECT_DIR=$(find extracted -type f -name settings.gradle -print -quit | xargs -r dirname)
            if [ -z "$PROJECT_DIR" ]; then
              echo "Could not find settings.gradle in the ZIP." >&2
              find extracted -maxdepth 4 -type f | head -100
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(find . -type f -name settings.gradle -not -path './.gradle/*' -print -quit | xargs -r dirname)
            if [ -z "$PROJECT_DIR" ]; then
              echo "Android project not found. Put the project files in the repository root or upload Thanos-Android-App-Project.zip." >&2
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thanos-Debug-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
