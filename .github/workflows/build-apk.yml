name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unzip Project Files
        run: |
          unzip -q ResultTime-Android-App-Project-fullscreen-crash-fixed.zip -d ./
          ls -la ResultTime-Android-App-Project-fixed/android-app

      - name: Build APK with System Gradle
        run: |
          cd ResultTime-Android-App-Project-fixed/android-app
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResultTime-App-Debug
          path: ResultTime-Android-App-Project-fixed/android-app/app/build/outputs/apk/debug/*.apk
